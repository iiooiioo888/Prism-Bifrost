[project]
name = "prism-bifrost"
version = "1.0.0"
description = "稜鏡（Prism Bifröst）公開資訊訊號感知與研判輔助系統"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
