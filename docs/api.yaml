openapi: 3.1.0
info:
  title: 稜鏡 Prism Bifröst
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /events:
    get:
      summary: 事件列表
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, stale, merged, split] }
        - in: query
          name: min_priority
          schema: { type: number }
        - in: query
          name: entity
          schema: { type: string }
        - in: query
          name: abstain
          schema: { type: boolean }
      responses:
        "200": { description: 事件摘要列表 }
  /events/{event_id}:
    get:
      summary: 事件詳情
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 提及、指標、實體與建議 }
  /events/{event_id}/mentions:
    get:
      summary: 事件提及
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 提及列表 }
  /events/{event_id}/metrics:
    get:
      summary: 事件指標
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 確定性指標 }
  /events/{event_id}/merge:
    post:
      summary: 把來源事件歸併進路徑上的事件
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
        - in: header
          name: X-Confirm
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_event_id]
              properties:
                source_event_id: { type: string }
                reason: { type: string }
      responses:
        "200": { description: 已歸併 }
  /events/{event_id}/split:
    post:
      summary: 拆分提及到新事件
      parameters:
        - in: path
          name: event_id
          required: true
          schema: { type: string }
        - in: header
          name: X-Confirm
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已拆分 }
  /events/{event_id}/promote:
    post:
      summary: 將棄權事件提升回研判
      responses:
        "200": { description: 已提升 }
  /mentions/{mention_id}/label:
    post:
      summary: 標註提及，不改寫所屬事件
      parameters:
        - in: path
          name: mention_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, enum: [confirm, exclude, uncertain] }
                note: { type: string }
      responses:
        "200": { description: 已標註 }
  /alerts:
    get:
      summary: 告警佇列
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
      responses:
        "200": { description: 含觸發規則與原始網址 }
  /briefs:
    get:
      summary: 簡報列表
      responses:
        "200": { description: 簡報快照 }
    post:
      summary: 生成簡報
      responses:
        "200": { description: 新簡報 }
  /briefs/{brief_id}:
    get:
      summary: 簡報快照
      parameters:
        - in: path
          name: brief_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 簡報 }
  /health/probes:
    get:
      summary: 探針健康度
      responses:
        "200":
          description: 含降級、未啟用通道、劣化速率與是否提前備選
  /health/proxies:
    get:
      summary: 出口代理池
      responses:
        "200":
          description: 代理啟用狀態。拒絕後不換 IP
  /marketplaces:
    get:
      summary: 商品平台
      responses:
        "200":
          description: 只含天貓、淘寶、拼多多、京東、轉轉
  /scenes/{scene_id}/monitors:
    post:
      summary: 依商品名稱到五個平台監測公開標價
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 各平台的公開標價或停止原因。不建立規範事件 }
        "404": { description: 場景不是商品監測 }
        "422": { description: 商品名稱無法用於監測 }
  /scenes/{scene_id}/watches/run:
    post:
      summary: 跑到期的商品名稱監測與已貼上的商品頁
      responses:
        "200": { description: 手動之外，補跑每天與標價變動後的再查 }
  /scenes/{scene_id}/listings:
    post:
      summary: 讀取商品頁並寫入 SKU 報價
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 商品報價。不建立規範事件 }
        "403": { description: 站點規則拒絕、robots 禁止或目標拒絕 }
        "404": { description: 場景不是商品監測 }
        "422": { description: 不是這五個平台的商品頁，或頁面沒有公開商品資料 }
  /scenes:
    get:
      summary: 場景配置
      responses:
        "200": { description: 五維度、融合方式與合規登記 }
  /scenes/{scene_id}:
    get:
      summary: 單一場景
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 場景配置 }
  /scenes/{scene_id}/decisions:
    get:
      summary: 場景決策
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 可複核結論，金額為字串 }
  /scenes/{scene_id}/images:
    get:
      summary: 某 SKU 已保存的公開商品圖
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
        - in: query
          name: sku_code
          required: true
          schema: { type: string }
      responses:
        "200": { description: 商品圖清單。沒有 SKU 時 items 為空 }
    post:
      summary: 從公開頁抓取標成商品圖的檔案
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已保存與未保存的圖片。不跟隨重新導向 }
        "403": { description: 站點規則、robots 或目標拒絕。拒絕後不換 IP }
  /product-images/{image_id}:
    get:
      summary: 商品圖檔
      parameters:
        - in: path
          name: image_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: png、jpeg、gif 或 webp 位元組 }
  /scenes/{scene_id}/decide:
    post:
      summary: 產出 SKU 決策
      parameters:
        - in: path
          name: scene_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 快路徑或慢路徑結論 }
  /review/queue:
    get:
      summary: 待複核歸併建議
      responses:
        "200": { description: 中置信佇列 }
  /review/suggestions/{suggestion_id}/accept:
    post:
      summary: 採納歸併建議
      responses:
        "200": { description: 事實層已更新 }
  /review/suggestions/{suggestion_id}/reject:
    post:
      summary: 拒絕歸併建議
      responses:
        "200": { description: 事實層未改寫 }
  /dashboard:
    get:
      summary: 態勢面板讀模型
      responses:
        "200": { description: 時間序列、排序與健康度 }
  /compliance/erasure:
    post:
      summary: 依網址或作者刪除提及並保留審計
      responses:
        "200": { description: 已刪除的提及識別 }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
